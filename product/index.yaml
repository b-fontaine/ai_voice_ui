# Index racine de la documentation produit de Genesis Canvas (Release Copilot). Lire en premier.
# Procédure : tasks → ids ; sinon keywords → zone → index de la zone → documents ; suivre links sur 1 niveau.
# Savoir réutilisable (faits vérifiés, patterns, ADR génériques) : knowledge/index.yaml (skill kb-lookup).
version: 1
updated: 2026-10-31
product: "Genesis Canvas — cas d'usage Release Copilot"
conventions: _conventions.md
readme: README.md
lint: python3 -I product/_tools/product_lint.py

zones:
  - name: functional
    prefix: p-fn-
    index: functional/index.yaml
    description: "Produit fonctionnel : vision, personas et parcours en 3 actes, périmètre, exigences FR/NFR, règles RG, écran en 6 zones, catalogue, jeu de données, maquettes et écarts E1-E22, risques et DoD, glossaire, scénarios Gherkin"
    keywords: [fonctionnel, functional, acte 2, comparaison, vue iOS, vision, persona, parcours, acte, périmètre, scope, exigence, requirement, FR, NFR, MoSCoW, règle, RG, écran, zone, orbe, barge-in, interruption, raccourci, catalogue, composant, jeu de données, dataset, maquette, mockup, écart, risque, plan B, DoD, glossaire, gherkin, feature, scénario, BDD, lisibilité, 24 px, bande vide, régie, apparition animée, design et ergonomie, chevauchement de parole, liaison de délégation, rail, écho, S-05, O-01, L-01]
  - name: architecture
    prefix: p-ar-
    index: architecture/index.yaml
    description: "Architecture du produit : vue d'ensemble C4, app Flutter desktop Linux (Clean + FSD, Bloc), backend Go hexagonal en docker compose local, agents A2A réels et protocoles, stack et versions, design system et Widgetbook (tokens, apparition animée), rejeu A2UI (acte 4), sécurité, qualité, environnement de scène"
    keywords: [architecture, C4, design system, tokens, DTCG, Style Dictionary, SceneTokens, Widgetbook, apparition animée, animation, fondu, SceneMotion, périmètre de reconstruction, rail horizontal, polices réelles, composition par modèle, compositeur LLM, passerelle LLM, COMPOSER_MODEL, repli déterministe, plan structuré, squelette anticipé, view_unavailable, vue indisponible, CrashList, liste des crashs, gpt-6-luna, canevas partagé, POST /canvas/actions, action, clic, Barre d'actions, ActionBar, sous-chemin, writableSubPaths, path_not_allowed, voix hors délégation, Announce, bandeau, budget des zones, ParseIntent, updateDataModel, comparaison 3.3, plan, planificateur, rejected, catalogue genesis, contrat exécutable, remise à vide, canvas/reset, validation côté client, A2uiGate, BoundObject, squelette, état neutre, panneau protocole, étagère, rail, 1920×1080, agent A2A, tags, conteneur, docker, compose, local, linux, frontend, flutter, desktop, FSD, clean, bloc, DI, backend, go, orchestrateur, hexagonal, port, A2A, A2UI, app-channel, contrat, validateur, GenUI, WebRTC, sideband, gpt-live, séquence, stack, version, rejeu, replay, mode secours, journal, sécurité, clé, jeton, qualité, TDD, CI, NFR, scène, sono, audio, réseau, répétition, 013, lisibilité, 24 px, chevauchement de parole, overlap, VOICE_OVERLAP, écho, garde l'IA parle, liaison de délégation, DelegationLinks, motionLink]
  - name: roadmap
    prefix: p-rm-
    index: roadmap/index.yaml
    description: "Trajectoire : jalons J0-J9 jusqu'au talk, backlog par epics, spikes, registre des questions ouvertes Q-xx, pistes après le talk"
    keywords: [roadmap, jalon, milestone, planification, backlog, epic, couverture, spike, question ouverte, Q-, hypothèse, échéance, après le talk, au-delà, évolution]
  - name: decisions
    prefix: pdr-
    index: decisions/index.yaml
    description: "Décisions produit (PDR, fonctionnelles ou techniques, propres à Genesis Canvas) et ADR génériques de knowledge/ hérités par le produit"
    keywords: [décision, decision, PDR, ADR, pourquoi, choix, arbitrage, acceptée, proposée, remplacée, historique, héritage]

meta:
  - {id: p-readme, path: README.md, summary: "Porte d'entrée humaine et IA : produit en bref, par où commencer selon le profil, carte des documents, état, décisions, questions majeures, contribution"}
  - {id: p-conventions, path: _conventions.md, summary: "Où écrire, frontmatter, écriture, traçabilité, cycle de vie des PDR, index YAML, lint"}
  - {id: p-sources, path: sources/README.md, summary: "Sources primaires : fiche produit (validée) et maquettes (illustration) ; règles d'ajout ; chronologie de la répétition au micro du 2026-10-31 (observation datée)"}

entrypoints:
  - {id: p-readme, why: "vue d'ensemble et carte de la documentation"}
  - {id: p-fn-vision, why: "ce qu'est le produit et pourquoi il existe"}
  - {id: p-fn-requirements, why: "exigences FR-01..FR-20, contrat fonctionnel"}
  - {id: p-fn-screen, why: "l'écran unique en 6 zones et les états de l'orbe"}
  - {id: p-ar-overview, why: "architecture globale et répartition client / backend"}
  - {id: p-rm-roadmap, why: "jalons J0-J9 datés, dépendances, ordre de coupe"}
  - {id: p-rm-open-questions, why: "tout ce qui n'est pas décidé (écarts E1-E22, Q-01..Q-89 ; Q-88 et Q-89 tranchées par pdr-0081)"}
  - {id: pdr-0011-adopt-knowledge-adrs, why: "comment les ADR génériques s'appliquent au produit"}

