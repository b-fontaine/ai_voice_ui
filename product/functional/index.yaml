domain: functional
description: "Produit fonctionnel de Genesis Canvas (Release Copilot) : vision, personas, périmètre, exigences FR/NFR, règles RG, écran, catalogue, données, maquettes, risques, glossaire, scénarios Gherkin"
docs:
  - {id: p-fn-vision, path: vision.md, summary: "Énoncé produit, problème, message unique du talk, cas d'usage Release Copilot, cadre du livrable", tags: [vision, produit, talk, release-copilot]}
  - {id: p-fn-personas-journey, path: personas-journey.md, summary: "3 personas (speaker, dev Flutter, lead tech) et parcours en 3 actes + rejeu, phrases clés ; acte 3 livré par 009", tags: [personas, parcours, actes, demo]}
  - {id: p-fn-scope, path: scope.md, summary: "Périmètre du MVP et hors-périmètre explicite", tags: [perimetre, mvp, hors-perimetre]}
  - {id: p-fn-requirements, path: requirements.md, summary: "FR-01..FR-20 (MoSCoW) avec scénarios BDD S-01..S-09 et règles RG, couverture BDD ; FR-08 et S-03 livrés par 009 (2026-10-30) ; FR-09 livrée par 010 (2026-10-30) ; FR-13, FR-15, FR-16, FR-19 livrées (FR-14 sur le chemin « Stop ») par 011 ; S-05 en partie (Q-77), S-06 vert ; FR-17 partielle, FR-12 et FR-20 à J7", tags: [exigences, fr, moscow, bdd]}
  - {id: p-fn-nfr, path: nfr.md, summary: "NFR-01..NFR-12 avec mesure ; tension latence voix / latence UI ; NFR-02 : +300 ms de fenêtre de demande à remesurer (011, Q-80)", tags: [nfr, latence, lisibilite, resilience, securite]}
  - {id: p-fn-screen, path: screen.md, summary: "Écran unique en 6 zones, états de l'orbe, modes d'interaction, raccourcis facultatifs (pdr-0033) ; zones telles que livrées par 007 (indicateur d'acte, Remettre à vide, rail piloté par plan, panneau replié qui recouvre le canevas, étagère, emplacement Rejeu, D1-D6 de pdr-0063, budget 1920×1080 et limite) ; 009 : Barre d'actions en bandeau de 72 px sous la grille, budget des zones modifié (barre 128, canevas 572, marges 40), étagère « 5 / 6 », bande vide à valider par le porteur ; 010 : zone Rejeu active (480 px, deux rangées de 48 px, étagère 900 px, indicateur « Acte 4 · Rejeu », comportements en rejeu, points à voir en répétition) ; 011 : indicateur d'acte automatique, orbe « Interrompue » tenue jusqu'à 3 s de silence, retour au clic fort", tags: [ecran, zones, orbe, raccourcis, interaction]}
  - {id: p-fn-catalog, path: catalog.md, summary: "Catalogue retenu (6 composants, pdr-0014), règles du catalogue ; contrat exécutable genesis v1 (006 : 4 composants en liste blanche J3 contre catalogComponents = 6, noms techniques, statuts ok|risk|blocking, trois temps, champs comparison réservés) ; rendu côté app (007) : trois états squelette / sans données / neutre, RG-10, troncature honnête de la checklist, emplacements déterministes 2×2 puis 3×2 ; historique : 8 composants de la fiche et catalogue des maquettes ; 009 : ActionBar (5 composants avec schéma), sous-chemins inscriptibles et code path_not_allowed, trois états et tons du bouton, bandeau hors grille ; CrashList réelle livrée par 012 (surface crashes, 6 composants dans le contrat)", tags: [catalogue, composants, a2ui, genui, theme]}
  - {id: p-fn-business-rules, path: business-rules.md, summary: "Règles de fonctionnement RG-01..RG-30 : construction, catalogue, interruption, interaction, secours, données ; RG-18, RG-28, RG-30 livrées par 009 ; RG-19 respectée par 010 ; RG-11 à RG-14 et RG-17 livrées par 011", tags: [regles, fonctionnement, interruption, catalogue, rejeu]}
  - {id: p-fn-dataset, path: dataset.md, summary: "Jeu de référence figé Release Copilot 3.3/3.4 iOS/Android (pdr-0040) : séries 7 j, valeurs de l'acte 1, top 5 crashs, seuils, contrôles arithmétiques ; valeurs de l'acte 1 recalculées par le code du backend sans écart (006) ; actes 2 et 3 et vue iOS : p-fn-dataset-acts ; liste des crashs embarquée (012)", tags: [donnees, dataset, determinisme, release]}
