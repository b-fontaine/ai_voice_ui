# Index racine de la base de connaissances (zettelkasten). Lire en premier.
# Procédure : tasks → ids ; sinon keywords → domaine → index du domaine → notes ; suivre links sur 1 niveau.
version: 1
updated: 2026-10-28
conventions: _conventions.md
tags_index: tags.yaml
lint: python3 -I knowledge/_tools/kb_lint.py

