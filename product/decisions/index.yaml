domain: decisions
description: "Registre de TOUTES les décisions qui gouvernent Genesis Canvas : décisions produit (pdr-*, propres au produit, fonctionnelles ou techniques) dans docs, et ADR génériques de knowledge/ appliqués au produit dans inherited. Créer ou modifier une décision : skill product-decide, gabarit _template.md (exclu du lint)."
next_id: pdr-0027
docs:
  - {id: pdr-0001-conference-demo-deliverable, path: pdr-0001-conference-demo-deliverable.md, summary: "2026-10-28 acceptée — livrable = démo de conférence, pas un produit de production ; pas d'auth, de multi-utilisateur ni de persistance", tags: [pdr, scope, conference, demo], decision_status: acceptée}
  - {id: pdr-0002-desktop-platform, path: pdr-0002-desktop-platform.md, summary: "2026-10-28 acceptée — Flutter desktop, macOS prioritaire, Windows en secours, projection 1920×1080 ; mobile et web écartés ; OS de démo non confirmé (Q-07)", tags: [pdr, platform, desktop, macos, windows], decision_status: acceptée}
  - {id: pdr-0003-use-case-release-copilot, path: pdr-0003-use-case-release-copilot.md, summary: "2026-10-28 acceptée — cas d'usage Release Copilot : décision go/no-go d'une release mobile 3.4 vs 3.3 ; agents : voir pdr-0013", tags: [pdr, use-case, release-copilot], decision_status: acceptée}
  - {id: pdr-0004-mvp-three-acts, path: pdr-0004-mvp-three-acts.md, summary: "2026-10-28 acceptée — MVP = 3 actes (créer, transformer, interagir) + rejeu optionnel ; hors-périmètre explicite ; acte « agent tiers » ouvert (Q-10)", tags: [pdr, scope, mvp, acts], decision_status: acceptée}
  - {id: pdr-0005-frozen-fictional-dataset, path: pdr-0005-frozen-fictional-dataset.md, summary: "2026-10-28 acceptée — données fictives figées et déterministes (NFR-08) ; Crashlytics, App Store Connect, Play Console écartés", tags: [pdr, dataset, determinism], decision_status: acceptée}
  - {id: pdr-0006-replay-fallback-must, path: pdr-0006-replay-fallback-must.md, summary: "2026-10-28 acceptée — enregistrement + rejeu 0,25×–2× = Must et mode secours en < 2 s sans redémarrage (FR-09, FR-10, NFR-07)", tags: [pdr, replay, fallback, resilience], decision_status: acceptée}
  - {id: pdr-0007-closed-catalog-stage-theme, path: pdr-0007-closed-catalog-stage-theme.md, summary: "2026-10-28 acceptée — catalogue fermé, apparence par le thème de scène jamais par l'IA, état neutre et squelette ; contenu exact : voir pdr-0014", tags: [pdr, catalog, theme, genui, a2ui], decision_status: acceptée}
  - {id: pdr-0008-single-screen-show-the-making, path: pdr-0008-single-screen-show-the-making.md, summary: "2026-10-28 acceptée — écran unique en 6 zones (barre, canevas, rail des agents, flux du protocole, étagère du catalogue, rejeu) qui montre la fabrication", tags: [pdr, screen, layout, pedagogy], decision_status: acceptée}
  - {id: pdr-0009-french-only, path: pdr-0009-french-only.md, summary: "2026-10-28 acceptée — conversation, transcription et UI en français uniquement ; langue injectée par configuration", tags: [pdr, language, french], decision_status: acceptée}
  - {id: pdr-0010-pinned-experimental-versions, path: pdr-0010-pinned-experimental-versions.md, summary: "2026-10-28 acceptée — Flutter, genui, genui_a2a figés, pubspec.lock committé, build propre sur machine vierge (NFR-10) ; versions exactes ouvertes (Q-25)", tags: [pdr, versions, reproducibility, genui], decision_status: acceptée}
  - {id: pdr-0011-adopt-knowledge-adrs, path: pdr-0011-adopt-knowledge-adrs.md, summary: "2026-10-28 acceptée — le produit applique adr-0001..adr-0008 de knowledge/ ; tableau ADR → contraintes concrètes et points de friction", tags: [pdr, adr, inheritance, architecture], decision_status: acceptée}
  - {id: pdr-0012-voice-provider-openai, path: pdr-0012-voice-provider-openai.md, summary: "2026-10-28 proposée — fournisseur voix OpenAI gpt-live-1 (WebRTC, relais SDP backend) derrière le port VoiceSession ; Gemini Live en alternative ; décision du porteur attendue (Q-11)", tags: [pdr, voice, openai, gpt-live, proposed], decision_status: proposée}
  - {id: pdr-0013-orchestrator-visible-agent-selection, path: pdr-0013-orchestrator-visible-agent-selection.md, summary: "2026-10-29 acceptée — l'orchestrateur choisit visiblement ses agents (actifs / en veille) ; noms métier de la fiche ; nombre libre (tranche Q-01)", tags: [pdr, agents, orchestrator, rail], decision_status: acceptée}
  - {id: pdr-0014-six-component-catalog, path: pdr-0014-six-component-catalog.md, summary: "2026-10-29 acceptée — catalogue de 6 composants (noms de la fiche, comportement des maquettes), Sentiment des avis = version de la fiche (tranche Q-02, Q-60)", tags: [pdr, catalog, genui, sentiment], decision_status: acceptée}
  - {id: pdr-0015-app-held-canvas-layout, path: pdr-0015-app-held-canvas-layout.md, summary: "2026-10-29 acceptée — grille fixe tenue par l'app, N surfaces, pas de Grid dans le catalogue (tranche Q-29)", tags: [pdr, layout, surfaces, grid], decision_status: acceptée}
  - {id: pdr-0016-validate-release-action, path: pdr-0016-validate-release-action.md, summary: "2026-10-29 acceptée — « Valider la release » se comporte comme « Bloquer la release » (tranche Q-62)", tags: [pdr, actions, checklist], decision_status: acceptée}
  - {id: pdr-0017-source-hierarchy-sheet-over-mockups, path: pdr-0017-source-hierarchy-sheet-over-mockups.md, summary: "2026-10-29 acceptée — la fiche produit fait foi ; maquettes = illustration de la vision, jamais suivies à la lettre ni pour le technique ; un écart fiche/maquette n'est pas une question (remplace « tout laisser ouvert »)", tags: [pdr, sources, maquettes, gouvernance], decision_status: acceptée}
  - {id: pdr-0018-a2ui-v09-genui-0-10-4, path: pdr-0018-a2ui-v09-genui-0-10-4.md, summary: "2026-10-29 acceptée (décision contrainte) — A2UI v0.9 (createSurface/updateComponents/updateDataModel/deleteSurface, \"version\": \"v0.9\" exactement), genui 0.10.4 figé (tranche Q-03)", tags: [pdr, a2ui, genui, versions, decision-contrainte], decision_status: acceptée}
  - {id: pdr-0019-six-limit-applies-to-surfaces, path: pdr-0019-six-limit-applies-to-surfaces.md, summary: "2026-10-29 acceptée (décision contrainte) — la limite « 6 » porte sur les surfaces visibles (NFR-06, RG-05) ; aucun compteur de composants sur l'étagère (tranche Q-04)", tags: [pdr, surfaces, catalog, decision-contrainte], decision_status: acceptée}
  - {id: pdr-0020-act1-four-surfaces, path: pdr-0020-act1-four-surfaces.md, summary: "2026-10-29 acceptée (décision contrainte) — acte 1 = 4 surfaces : Indicateur clé, Courbe de tendance, Sentiment des avis, Checklist go/no-go (tranche Q-28)", tags: [pdr, acte-1, catalog, decision-contrainte], decision_status: acceptée}
  - {id: pdr-0021-mockup-data-not-corrected, path: pdr-0021-mockup-data-not-corrected.md, summary: "2026-10-29 acceptée (décision contrainte) — incohérences de données des maquettes sans objet ; le jeu de référence (Q-23) doit être cohérent, figé, déterministe (tranche Q-33)", tags: [pdr, dataset, maquettes, decision-contrainte], decision_status: acceptée}
  - {id: pdr-0022-gherkin-steps-no-leading-digit, path: pdr-0022-gherkin-steps-no-leading-digit.md, summary: "2026-10-29 acceptée (décision contrainte) — steps Gherkin reformulés sans chiffre initial ; bdd_widget_test conservé (tranche Q-34)", tags: [pdr, bdd, gherkin, decision-contrainte], decision_status: acceptée}
  - {id: pdr-0023-example-guided-composition, path: pdr-0023-example-guided-composition.md, summary: "2026-10-29 acceptée (décision contrainte) — composition A2UI par LLM guidé par exemples d'écrans attendus sur catalogue fermé ; ni LLM libre ni plans pré-écrits (tranche Q-38)", tags: [pdr, composition, determinisme, decision-contrainte], decision_status: acceptée}
  - {id: pdr-0024-act2-android-only, path: pdr-0024-act2-android-only.md, summary: "2026-10-29 acceptée (décision contrainte) — acte 2 : toutes les données affichées concernent Android, checklist comprise (tranche Q-58)", tags: [pdr, acte-2, android, decision-contrainte], decision_status: acceptée}
  - {id: pdr-0025-top-bar-speaker-and-ai-lines, path: pdr-0025-top-bar-speaker-and-ai-lines.md, summary: "2026-10-29 acceptée (décision contrainte) — barre supérieure : répliques du speaker et de l'IA en direct, réplique coupée tronquée (tranche Q-59)", tags: [pdr, transcription, barge-in, decision-contrainte], decision_status: acceptée}
  - {id: pdr-0026-desktop-only-target, path: pdr-0026-desktop-only-target.md, summary: "2026-10-29 acceptée (décision contrainte) — desktop seul (macOS, Windows en secours, 1920×1080) ; ADR et notes orientés web sans effet sur la cible (tranche Q-64)", tags: [pdr, platform, desktop, decision-contrainte], decision_status: acceptée}
inherited:
  - {id: adr-0001-initial-constraints, path: ../../knowledge/decisions/adr-0001-initial-constraints.md, summary: "2026-10-26 acceptée — Flutter, Clean+FSD, get_it/injectable, Bloc sans Cubit, TDD/BDD", applies: "Architecture front (barrels, DI par constructeur, Bloc sealed/freezed), BDD bdd_widget_test depuis les .feature de la fiche, mocks aux frontières ; cible web/mobile de l'ADR restreinte au desktop par pdr-0002"}
  - {id: adr-0002-orchestrator-backend, path: ../../knowledge/decisions/adr-0002-orchestrator-backend.md, summary: "2026-10-27 acceptée — orchestrateur côté backend dès la phase 1", applies: "Orchestrateur et agents A2A côté backend ; l'app ne porte que audio/WebRTC, rendu A2UI et outils locaux sans secret (NFR-09) ; journal de rejeu disponible côté app pour le mode secours hors réseau"}
  - {id: adr-0003-backend-go, path: ../../knowledge/decisions/adr-0003-backend-go.md, summary: "2026-10-27 acceptée puis reconfirmée — backend Go hexagonal, module agent_orchestrator", applies: "Backend Go, ports pour Live et A2UI, JWT par JWKS et CORS restreint (friction avec « pas d'auth », Q-15), a2a-go/v2 prévu en phase 2 alors que la démo montre des agents A2A (Q-16), dépôt d'accueil à confirmer (Q-27)"}
  - {id: adr-0004-ds-visual-base-m3, path: ../../knowledge/decisions/adr-0004-ds-visual-base-m3.md, summary: "2026-10-28 acceptée — DS maison sur Material 3 via material_ui + conventions desktop", applies: "Composants Ds* sur material_ui enveloppés par les CatalogItem ; thème de scène via ThemeData/ThemeExtension ; conventions Cmd/Ctrl à concilier avec les raccourcis à touche seule de la fiche (Q-05)"}
  - {id: adr-0005-ds-tokens-style-dictionary, path: ../../knowledge/decisions/adr-0005-ds-tokens-style-dictionary.md, summary: "2026-10-28 acceptée — tokens DTCG dans Git, Style Dictionary + ThemeExtension custom", applies: "Thème de scène (texte ≥ 24 px, contraste WCAG AA, NFR-05) décrit en tokens DTCG et généré en Dart ; code généré committé et vérifié en CI"}
  - {id: adr-0006-ds-no-widgetbook-cloud, path: ../../knowledge/decisions/adr-0006-ds-no-widgetbook-cloud.md, summary: "2026-10-28 acceptée — pas de Widgetbook Cloud : goldens locaux + catalogue web statique", applies: "Non-régression visuelle des composants du catalogue par goldens alchemist en CI ; pas d'annotation cloud*"}
  - {id: adr-0007-ds-design-tool-claude-design, path: ../../knowledge/decisions/adr-0007-ds-design-tool-claude-design.md, summary: "2026-10-28 acceptée — Claude Design pour maquettes/prototypes ; DTCG reste source de vérité", applies: "Maquettes, prototypes de surfaces et slides du talk dans Claude Design ; les maquettes illustrent la vision, ce ne sont ni une spécification ni du code (pdr-0017) ; pas de Figma"}
  - {id: adr-0008-ds-widgetbook-4-beta, path: ../../knowledge/decisions/adr-0008-ds-widgetbook-4-beta.md, summary: "2026-10-28 acceptée — Widgetbook 4.0.0-beta.14 épinglé", applies: "Une story par composant du catalogue, surfaces A2UI rejouées en cache ; même politique d'épinglage que pdr-0010 ; 5 contournements du spike à appliquer"}
