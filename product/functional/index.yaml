domain: functional
description: "Produit fonctionnel de Genesis Canvas (Release Copilot) : vision, personas, périmètre, exigences FR/NFR, règles RG, écran, catalogue, données, maquettes, risques, glossaire, scénarios Gherkin"
docs:
  - {id: p-fn-vision, path: vision.md, summary: "Énoncé produit, problème, message unique du talk, cas d'usage Release Copilot, cadre du livrable", tags: [vision, produit, talk, release-copilot]}
  - {id: p-fn-personas-journey, path: personas-journey.md, summary: "3 personas (speaker, dev Flutter, lead tech) et parcours en 3 actes + rejeu, phrases clés ; acte 3 livré par 009", tags: [personas, parcours, actes, demo]}
  - {id: p-fn-scope, path: scope.md, summary: "Périmètre du MVP et hors-périmètre explicite", tags: [perimetre, mvp, hors-perimetre]}
  - {id: p-fn-requirements, path: requirements.md, summary: "FR-01..FR-20 (MoSCoW) avec scénarios BDD S-01..S-09 et règles RG, couverture BDD ; FR-08 et S-03 livrés par 009 (2026-10-30) ; FR-09 livrée par 010 (2026-10-30) ; FR-13, FR-15, FR-16, FR-19 livrées (FR-14 sur le chemin « Stop ») par 011 ; S-06 vert ; FR-17 partielle, FR-12 et FR-20 à J7 ; FR-04 (apparition animée) livrée par 013 ; 014 (2026-10-31) : FR-12, FR-20 (S-09) et FR-17 second temps (S-07) livrées, FR-14 chemin correction, vert en BDD ; 015 (2026-10-31) : S-05 complet (couper la parole sans mot d'arrêt, FR-13, FR-19), liaison animée de délégation (FR-03), écho logiciel seulement (FR-18, AEC sur enceinte : SP-06) ; Q-79, Q-80, Q-87 restent à observer", tags: [exigences, fr, moscow, bdd]}
  - {id: p-fn-nfr, path: nfr.md, summary: "NFR-01..NFR-12 avec mesure ; tension latence voix / latence UI ; NFR-02 : +300 ms de fenêtre de demande à remesurer (011, Q-80) ; 013 : NFR-05 (24 px, contraste AA) vérifiée par tests et captures, NFR-04 côté périmètre de reconstruction, 60 i/s à mesurer à J7 ; NFR-12 après 014 : boutons et raccourcis M / Échap", tags: [nfr, latence, lisibilite, resilience, securite]}
  - {id: p-fn-screen, path: screen.md, summary: "Écran unique en 6 zones, états de l'orbe, modes d'interaction, raccourcis facultatifs (pdr-0033) ; zones telles que livrées par 007 (indicateur d'acte, Remettre à vide, rail piloté par plan, panneau replié qui recouvre le canevas, étagère, emplacement Rejeu, D1-D6 de pdr-0063, budget 1920×1080 et limite) ; 009 : Barre d'actions en bandeau de 72 px sous la grille, budget des zones modifié (barre 128, canevas 572, marges 40), étagère « 5 / 6 », bande vide à valider par le porteur ; 010 : zone Rejeu active (480 px, deux rangées de 48 px, étagère 900 px, indicateur « Acte 4 · Rejeu », comportements en rejeu, points à voir en répétition) ; 011 : indicateur d'acte automatique, orbe « Interrompue » tenue jusqu'à 3 s de silence, retour au clic fort ; 013 : budget des zones refait (rail horizontal de 96 px, canevas 676 px, cellules 624×302), régie empilée de deux contrôles de 48 px, panneau borné, cellules lisibles, apparition animée ; 014 : régie à deux colonnes de 480 px, boutons Couper le micro / Faire taire, voile Micro coupé par-dessus l'orbe, raccourcis M et Échap (Espace non retenu) ; 015 : liaison animée de délégation du rail (trait pointillé, période 1200 ms, arc au-dessus des pastilles), rail en rejeu à voir (Q-88)", tags: [ecran, zones, orbe, raccourcis, interaction]}
  - {id: p-fn-catalog, path: catalog.md, summary: "Catalogue retenu (6 composants, pdr-0014), règles du catalogue ; contrat exécutable genesis v1 (006 : 4 composants en liste blanche J3 contre catalogComponents = 6, noms techniques, statuts ok|risk|blocking, trois temps, champs comparison réservés) ; rendu côté app (007) : trois états squelette / sans données / neutre, RG-10, troncature honnête de la checklist, emplacements déterministes 2×2 puis 3×2 ; historique : 8 composants de la fiche et catalogue des maquettes ; 009 : ActionBar (5 composants avec schéma), sous-chemins inscriptibles et code path_not_allowed, trois états et tons du bouton, bandeau hors grille ; CrashList réelle livrée par 012 (surface crashes, 6 composants dans le contrat) ; 013 : limite de la grille 3×2 levée (libellés à la ligne, extraits d'avis entiers puis « + N avis », étagère à six noms entiers)", tags: [catalogue, composants, a2ui, genui, theme]}
  - {id: p-fn-business-rules, path: business-rules.md, summary: "Règles de fonctionnement RG-01..RG-30 : construction, catalogue, interruption, interaction, secours, données ; RG-18, RG-28, RG-30 livrées par 009 ; RG-19 respectée par 010 ; RG-11 à RG-14 et RG-17 livrées par 011 ; RG-12, RG-15, RG-22 respectées par 014 ; RG-11, RG-16, RG-17 complétées par 015 (chevauchement, écho)", tags: [regles, fonctionnement, interruption, catalogue, rejeu]}
  - {id: p-fn-dataset, path: dataset.md, summary: "Jeu de référence figé Release Copilot 3.3/3.4 iOS/Android (pdr-0040) : séries 7 j, valeurs de l'acte 1, top 5 crashs, seuils, contrôles arithmétiques ; valeurs de l'acte 1 recalculées par le code du backend sans écart (006) ; actes 2 et 3 et vue iOS : p-fn-dataset-acts ; liste des crashs embarquée (012)", tags: [donnees, dataset, determinisme, release]}
  - {id: p-fn-dataset-acts, path: dataset-acts.md, summary: "Jeu de données, suite : acte 2 (Android seul, comparaison 3.3 : 99,43 % / 99,71 %, −0,28 pt, 30 % / 14 %, +16 pts, NO-GO Android), vue iOS de la correction (99,80 %, GO iOS, 3 extraits), acte 3 ; recalculés par les tests Go depuis les lignes brutes sans écart (008) ; acte 3 livré par 009 : libellés « Bloquée » / « Validée », titre et boutons de la Barre d'actions lus dans dataset.json", tags: [donnees, dataset, acte-2, ios]}
  - {id: p-fn-mockups, path: mockups.md, summary: "Description des 3 maquettes et registre des écarts E1..E22 entre sources", tags: [maquettes, design, ecarts, a2ui]}
  - {id: p-fn-risks-acceptance, path: risks-acceptance.md, summary: "Risques R1..R8 (probabilité, impact, parade), plan B, DoD de la démo, métriques du talk ; constats de 009 (voix hors délégation Q-75, clic en 409 busy, bande vide, décision perdue Q-76)", tags: [risques, plan-b, dod, metriques, repetition]}
  - {id: p-fn-glossary, path: glossary.md, summary: "Vocabulaire produit, écran, voix, agents/protocoles, rejeu", tags: [glossaire, vocabulaire]}
  - {id: p-fn-feature-voice-screen-generation, path: features/voice-screen-generation.feature, summary: "Gherkin : actes 1-3 (S-01..S-03) ; S-04 bascule en mode secours retiré et commenté (pdr-0032) ; 011 : K-01 (comparaison après focus) et K-02 (mot à l'offset)", tags: [bdd, gherkin, actes, secours]}
  - {id: p-fn-feature-barge-in, path: features/barge-in.feature, summary: "Gherkin : interrompre, annuler, corriger, bruit court, silence clavier (S-05..S-09) ; couverture automatisée par 011 (S-06), 014 (S-07, S-09 verts ; S-08 non automatisé) et 015 (S-05 complet, sans mot d'arrêt)", tags: [bdd, gherkin, barge-in, interruption]}
  - {id: p-fn-feature-voice-interaction-011, path: features/voice-interaction-011.feature, summary: "Gherkin complémentaire de 011 (hors des 9 scénarios de la fiche) : K-03 à K-07 (Stop, mots entiers, interruption côté app, indicateur d'acte, retour au clic), automatisés en Go et en Flutter", tags: [bdd, gherkin, barge-in, interruption, 011]}
  - {id: p-fn-feature-silence-micro-correction-014, path: features/silence-micro-correction-014.feature, summary: "Gherkin complémentaire de 014 (hors des 9 scénarios de la fiche) : M-01, M-02 (couper le micro), S-07 bis, C-01 à C-05 (correction en vol, correction nue, mot d'arrêt, file, action seule) ; Flutter et Go (tag acceptance), non-régression TestR01..R03", tags: [bdd, gherkin, barge-in, micro, silence, correction, 014]}
  - {id: p-fn-feature-chevauchement-liaison-015, path: features/chevauchement-liaison-015.feature, summary: "Gherkin complémentaire de 015 (hors des 9 scénarios de la fiche) : S-05 sans mot d'arrêt, O-01 à O-08 (chevauchement : écho, mots vides, interrupteur, exécution en vol, priorité Stop et correction, IA silencieuse, commentaire sur sa propre demande), L-01 à L-04 (liaison animée de délégation du rail) ; Flutter et Go (tag acceptance)", tags: [bdd, gherkin, barge-in, chevauchement, rail, liaison, 015]}
  - {id: p-fn-feature-llm-composer-012, path: features/llm-composer-012.feature, summary: "Gherkin complémentaire de 012 (hors des 9 scénarios de la fiche) : C-01 à C-08 (plan du modèle, repli déterministe, liste des crashs, vue indisponible, passerelle interne, bout en bout) en Go, F-01 et F-02 (cinquième cellule, trois états de CrashList) en Flutter", tags: [bdd, gherkin, composition, llm, crashlist, 012]}
  - {id: p-fn-feature-design-ergonomics-013, path: features/design-ergonomie-013.feature, summary: "Gherkin complémentaire de 013 (hors des 9 scénarios de la fiche) : D-01 à D-07 (pas de bande vide, cellules sans libellé tronqué, titre de courbe, étagère à six noms entiers, régie de 48 px et panneau borné, apparition en trois temps, aucun déplacement), automatisés en Flutter en polices réelles", tags: [bdd, gherkin, design, ergonomie, 013]}
