name: genesis_canvas
description: Genesis Canvas, démo de conférence Flutter desktop (Release Copilot).
publish_to: none
version: 0.1.0+1

environment:
  sdk: 3.13.7
  flutter: 3.47.8
resolution: workspace

dependencies:
  a2ui_core: 0.1.1
  entity_catalog:
    path: ../../packages/entities/catalog
  entity_session:
    path: ../../packages/entities/session
  feature_agent_activity:
    path: ../../packages/features/agent_activity
  feature_canvas:
    path: ../../packages/features/canvas
  feature_catalog_shelf:
    path: ../../packages/features/catalog_shelf
  feature_protocol_feed:
    path: ../../packages/features/protocol_feed
  feature_replay:
    path: ../../packages/features/replay
  feature_stage_controls:
    path: ../../packages/features/stage_controls
  feature_voice_session:
    path: ../../packages/features/voice_session
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_webrtc: 1.6.3
  genui: 0.10.4
  get_it: 9.3.0
  injectable: 3.0.0
  shared_backend_channel:
    path: ../../packages/shared/backend_channel
  shared_core:
    path: ../../packages/shared/core
  shared_design_system:
    path: ../../packages/shared/design_system

dev_dependencies:
  bdd_widget_test: 3.0.4
  build_runner: 2.16.1
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: 3.1.3
  testing_backend_fakes:
    path: ../../testing/backend_fakes
  testing_voice_fakes:
    path: ../../testing/voice_fakes

flutter:
  uses-material-design: true
  assets:
    - assets/replays/
