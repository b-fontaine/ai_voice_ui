  - packages/entities/catalog
  - packages/shared/design_system
  - packages/features/protocol_feed
  - packages/features/catalog_shelf
  - packages/features/stage_controls
  - packages/features/replay
  - testing/backend_fakes
  - testing/bloc_harness
  - testing/real_fonts
  - testing/voice_fakes
