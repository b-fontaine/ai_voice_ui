docs:
  - {id: p-rm-roadmap, path: roadmap.md, summary: "Calendrier daté (replanifié le 2026-10-29 ; J2 livré le 2026-10-30 par 003, 004 et 005, essai réel avec micro laissé à la répétition SP-06) : J1 spikes 29-30/10, J2 31/10-1/11, J3 2-4/11, J4 5/11, J5 6/11, J6 7/11, J7 8-9/11, gel J8 10-11/11, talk J9 12/11 ; critères de sortie, dépendances Q-xx, ordre de coupe C1-C10 (proposition, Q-65), risques de délai RD-1..RD-11 ; J3 coupé en J3-A (006 backend) et J3-B (007 Flutter), toutes deux terminées le 2026-10-30 ; RD-9 levé par 007 (reste l'essai réel avec micro en répétition) ; J4 livré le 2026-10-30 par 008 (acte 2, FR-07, FR-17 partielle, canevas partagé) ; prochaine étape J5 ; J5 livré par 009 (2026-10-30), prochaine étape J6, risque RD-12 (voix hors délégation) ; J6 livré par 010 (2026-10-30, en avance : FR-09, journal en mémoire et rejeu par le même A2uiGate, zone Rejeu active, R-01 à R-09 verts), prochaine étape 011 selon l'ordre du porteur ; 011 livrée le 2026-10-30, prochaine = 012", tags: [roadmap, jalons, mvp, talk, planification, calendrier, gel, coupe]}
