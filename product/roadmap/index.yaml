docs:
  - {id: p-rm-roadmap, path: roadmap.md, summary: "Calendrier daté (replanifié le 2026-10-29 ; J2 livré le 2026-10-30 par 003, 004 et 005, essai réel avec micro laissé à la répétition SP-06) : J1 spikes 29-30/10, J2 31/10-1/11, J3 2-4/11, J4 5/11, J5 6/11, J6 7/11, J7 8-9/11, gel J8 10-11/11, talk J9 12/11 ; critères de sortie, dépendances Q-xx, ordre de coupe C1-C10 (proposition, Q-65), risques de délai RD-1..RD-11 ; J3 coupé en J3-A (006 backend) et J3-B (007 Flutter), toutes deux terminées le 2026-10-30 ; RD-9 levé par 007 (reste l'essai réel avec micro en répétition) ; J4 livré le 2026-10-30 par 008 (acte 2, FR-07, FR-17 partielle, canevas partagé) ; prochaine étape J5 ; J5 livré par 009 (2026-10-30), prochaine étape J6, risque RD-12 (voix hors délégation) ; J6 livré par 010 (2026-10-30, en avance : FR-09, journal en mémoire et rejeu par le même A2uiGate, zone Rejeu active, R-01 à R-09 verts), prochaine étape 011 selon l'ordre du porteur ; 011 livrée le 2026-10-30, prochaine = 012 ; 012 livrée le 2026-10-31 (compositeur LLM, CrashList), ordre : 013 puis J7 ; 014 (J7-A) livrée le 2026-10-31 ; 015 (011b : couper la parole sans mot d'arrêt, liaison animée de délégation) livrée le 2026-10-31 (gate --full vert, 67 contrôles), reste pour J7 : répétition avec le porteur (SP-06, réglage des seuils VOICE_OVERLAP_*, Q-80, Q-88)", tags: [roadmap, jalons, mvp, talk, planification, calendrier, gel, coupe]}
  - {id: p-rm-backlog, path: backlog.md, summary: "10 epics → FR-01..FR-20 (MoSCoW de la fiche) et NFR-01..NFR-12 ; matrice de couverture exigence → jalon ; état de livraison de 003, 004 et 005 par epic (EP-01 à EP-04) ; EP-03, EP-04, EP-09 : livraison de 006 (J3-A) ; EP-03 (rail complet), EP-04 (catalogue côté client, étagère), EP-05 (panneau du protocole), EP-08 (remise à vide) : livrés par 007 (J3-B) ; FR-07 livrée et FR-17 partielle (correction de plateforme) par 008 (J4) : EP-03, EP-04, EP-09 ; EP-03, EP-04, EP-06, EP-02 : livraison de 009 (acte 3) ; EP-07 et EP-05 (synchronisation du panneau) : livrés par 010 (J6, FR-09) ; EP-02, EP-03, EP-04, EP-06 : livraison de 011 (Stop, focus, indicateur d'acte, retour au clic) ; EP-03, EP-04, EP-09 : livraison de 012 (2026-10-31) ; 014 (2026-10-31) : FR-12, FR-20, FR-17 second temps livrées (EP-02, EP-06, EP-08) ; 015 (2026-10-31) : FR-13 et FR-19 (S-05 complet), FR-03 (liaison animée) livrées (EP-02, EP-06, EP-04, EP-01) ; 016 inscrite (2026-10-31, décision du porteur après la répétition au micro) : garde-fou des instructions vocales et reprise d'une demande mal comprise (EP-02, EP-06)", tags: [backlog, epics, moscow, couverture, exigences]}
  - {id: p-rm-spikes, path: spikes.md, summary: "SP-00 Widgetbook 4 (fait) ; J1 réduit à 1,5 j (29-30/10) : SP-10 genui Linux d'abord (+ SP-01), SP-03 A2A Go, SP-02 réduit ; SP-04..SP-07 absorbés dans J2, J3, J6, J7 (SP-05 livré par 010) ; SP-08 proposé à la coupe ; SP-09 sans objet ; SP-11 (coupure locale de la piste distante, T03 de 011, non fait)", tags: [spike, risques, j1, versions, latence, audio, a2ui]}
  - {id: p-rm-open-questions, path: open-questions.md, summary: "Registre Q-01..Q-89 : 84 closes (76 tranchées dont 9 décisions contraintes, 2 conformes (Q-41, Q-78 observée à la répétition du 2026-10-31), 3 sans objet, 3 gérées par le porteur), 5 ouvertes avant J7 et non bloquantes (Q-89 voix parasite, ajoutée après la répétition au micro, traitée par 016 ; Q-79 coupure de la piste distante sous flutter_webrtc Linux, spike SP-11 ; Q-80 horloges, deltas d\'entrée, NFR-02 +300 ms, enrichie par 015 : fenêtre de parole, faux positifs d\'écho, latence ; Q-87 délégation du fournisseur pour une correction en vol ; Q-88 rail vide en rejeu, écart au porteur, ajoutée par 015) ; Q-77 et Q-85 tranchées (pdr-0077) et livrées par 015 ; Q-40, Q-42, Q-67 (pdr-0069), Q-74, Q-75 (pdr-0071) implémentées par 011 ; 15 tranchées par le porteur le 2026-10-30 (pdr-0053 à pdr-0061); Q-43, Q-47 et Q-53 tranchées par pdr-0051, pdr-0050 et pdr-0052 ; échéances datées ; écarts E1..E22 (la fiche l\'emporte, pdr-0017) ; règle de clôture via product-decide ; 014 : Q-79 et Q-87 précisées, aucune question tranchée", tags: [questions-ouvertes, ecarts, hypotheses, decisions]}
