# Genesis Canvas : démo locale (pdr-0029, pdr-0041).
# Usage : `docker compose up --build`, après avoir créé `.env`.
# `.env` est requis (clé OPENAI_API_KEY) et ne doit JAMAIS être commité.
# Les valeurs VOICE_* ci-dessous sont des défauts de configuration, surchargeables par `.env`.
# Un service par agent A2A (ici `agent-quality` ; J3 ajoutera les autres). Les agents
# vivent sur le réseau interne `agents` : aucun port publié, aucune sortie réseau, aucun secret.
# Identifiant du catalogue A2UI : une seule valeur, partagée par l'orchestrateur
# (liste blanche) et l'agent (createSurface).
x-a2ui-catalog: &a2ui_catalog ${A2UI_CATALOG_ID:-https://a2ui.org/specification/v0_9/catalogs/basic/catalog.json}

services:
  orchestrator:
    build:
      context: backend/orchestrator
    env_file:
      - path: .env
        required: false
    environment:
      # Agents A2A joignables (réseau interne `agents`) et catalogue A2UI, partagé avec l'agent.
      AGENTS: http://agent-quality:8090/.well-known/agent-card.json
      A2UI_CATALOG_ID: *a2ui_catalog
      A2UI_COMPONENTS: ${A2UI_COMPONENTS:-Column,Text}
      # Délai maximal d'une délégation à un agent (NFR-03) et d'acquittement d'un commentaire vocal.
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-8s}
      VOICE_APPEND_ACK_TIMEOUT: ${VOICE_APPEND_ACK_TIMEOUT:-2s}
      VOICE_MODEL: ${VOICE_MODEL:-gpt-live-1}
      VOICE_VOICE: ${VOICE_VOICE:-brise}
      VOICE_DELEGATION_TYPE: ${VOICE_DELEGATION_TYPE:-client}
      # Plafond de durée d'une session (valeur provisoire, à confirmer par le porteur (Q-68)).
      VOICE_MAX_SESSION: ${VOICE_MAX_SESSION:-30m}
      # Attache du sideband en arrière-plan : tentatives et attente entre deux (SP-02 : 5 x 500 ms).
      VOICE_ATTACH_ATTEMPTS: ${VOICE_ATTACH_ATTEMPTS:-5}
      VOICE_ATTACH_DELAY: ${VOICE_ATTACH_DELAY:-500ms}
      # Délai maximal d'une écriture vers un client du canal /app (client bloqué : connexion coupée).
      WS_WRITE_TIMEOUT: ${WS_WRITE_TIMEOUT:-5s}
      # Réglages de répétition : attente de la confirmation de fermeture, puis limiteur de créations de session.
      VOICE_CLOSE_GUARD: ${VOICE_CLOSE_GUARD:-5s}
      SESSION_RATE_BURST: ${SESSION_RATE_BURST:-5}
      SESSION_RATE_WINDOW: ${SESSION_RATE_WINDOW:-10s}
      # Écoute sur toutes les interfaces du conteneur seulement ; l'hôte reste en 127.0.0.1.
      LISTEN_HOST: 0.0.0.0
      LISTEN_ALLOW_NON_LOOPBACK: "1"
      LISTEN_PORT: "8080"
      JOURNAL_DIR: /var/lib/genesis/journal
      VOICE_INSTRUCTIONS_FILE: /etc/genesis/voice-instructions.fr.md
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default, agents]
    depends_on:
      agent-quality:
        condition: service_healthy
    volumes:
      - journal:/var/lib/genesis/journal
      - ./backend/orchestrator/config/voice-instructions.fr.md:/etc/genesis/voice-instructions.fr.md:ro
    healthcheck:
      test: ["CMD", "/orchestrator", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  agent-quality:
    build:
      context: backend/agents
      args:
        AGENT: quality
    # Pas de env_file : l'agent n'a pas besoin de la clé OpenAI. Aucun port publié.
    environment:
      AGENT_LISTEN_ADDR: 0.0.0.0:8090
      AGENT_LISTEN_ALLOW_NON_LOOPBACK: "1"
      AGENT_PUBLIC_URL: http://agent-quality:8090
      A2UI_CATALOG_ID: *a2ui_catalog
    networks: [agents]
    healthcheck:
      test: ["CMD", "/agent", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  agents:
    internal: true

volumes:
  journal:
