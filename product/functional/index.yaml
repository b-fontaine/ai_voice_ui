  - {id: p-fn-feature-barge-in, path: features/barge-in.feature, summary: "Gherkin : interrompre, annuler, corriger, bruit court, silence clavier (S-05..S-09) ; couverture automatisée par 011 (S-05 en partie, S-06)", tags: [bdd, gherkin, barge-in, interruption]}
  - {id: p-fn-feature-voice-interaction-011, path: features/voice-interaction-011.feature, summary: "Gherkin complémentaire de 011 (hors des 9 scénarios de la fiche) : K-03 à K-07 (Stop, mots entiers, interruption côté app, indicateur d'acte, retour au clic), automatisés en Go et en Flutter", tags: [bdd, gherkin, barge-in, interruption, 011]}
  - {id: p-fn-feature-llm-composer-012, path: features/llm-composer-012.feature, summary: "Gherkin complémentaire de 012 (hors des 9 scénarios de la fiche) : C-01 à C-08 (plan du modèle, repli déterministe, liste des crashs, vue indisponible, passerelle interne, bout en bout) en Go, F-01 et F-02 (cinquième cellule, trois états de CrashList) en Flutter", tags: [bdd, gherkin, composition, llm, crashlist, 012]}
