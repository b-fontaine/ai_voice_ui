# Où est défini chaque identifiant métier (id du document).
requirement_index:
  "FR-01..FR-20": p-fn-requirements
  "NFR-01..NFR-12": p-fn-nfr
  "RG-01..RG-30": p-fn-business-rules
  "S-01..S-09 (scénarios BDD)": p-fn-requirements
  "D-01..D-07 (scénarios BDD de 013, à ne pas confondre avec D1..D8 de la DoD)": p-fn-feature-design-ergonomics-013
  "M-01, M-02, S-07 bis, C-01..C-05 (scénarios BDD de 014 ; C-01..C-05 à ne pas confondre avec C-01..C-08 de 012)": p-fn-feature-silence-micro-correction-014
  "O-01..O-08, L-01..L-04 (scénarios BDD de 015 ; S-05 complet)": p-fn-feature-chevauchement-liaison-015
  "E1..E22 (écarts entre sources)": p-fn-mockups
  "Q-01..Q-89 (questions ouvertes)": p-rm-open-questions
  "R1..R8 (risques), D1..D8 (DoD)": p-fn-risks-acceptance
  "J0..J9 (jalons)": p-rm-roadmap
  "EP-01..EP-10 (epics)": p-rm-backlog
  "SP-00..SP-11 (spikes)": p-rm-spikes
  "pdr-0001..pdr-0081": decisions/index.yaml
