  - {id: pdr-0064-008-act2-transform-details-assistant-decided, path: pdr-0064-008-act2-transform-details-assistant-decided.md, summary: "2026-10-30 acceptée — Détails de l'acte 2 (008) tranchés par la boucle (pdr-0062) : mutation par updateDataModel seul, comparaison 3.3 dans les composants existants, grammaire Android / iOS / 3.3, FR-17 en deux temps (correction de plateforme en J4, annulation en vol en J7), remise à vide au démarrage de l'app, vue iOS, couleurs de séries par plateforme, mesures dans une demande. Livrée et vérifiée par 008 (2026-10-30).", tags: [pdr, decision, acte-2, mutation, fr-17], decision_status: acceptée}
  - {id: pdr-0065-009-act3-interact-details-assistant-decided, path: pdr-0065-009-act3-interact-details-assistant-decided.md, summary: "2026-10-30 acceptée — Détails de l'acte 3 (009) tranchés par la boucle (pdr-0062) : clic transmis par POST /canvas/actions, Barre d'actions en cinquième surface créée à la fin de l'acte 2, résultat par updateDataModel du sous-chemin /checklist/decisionStatus, routage par tags de carte action:*, voix hors délégation (commentaire à delegation_id nul, repli sur refus du fournisseur seulement, puis consigne de l'orchestrateur ; hypothèse Q-75, voix non observée à l'essai réel), bandeau de 72 px hors grille (D7) et budget des zones modifié (D8, bande vide aux actes 1 et 2 à valider par le porteur), clic occupé / rejoué. Livrée et vérifiée par 009 (2026-10-30).", tags: [pdr, decision, acte-3, action, fr-08], decision_status: acceptée}
  - {id: pdr-0066-010-act4-replay-details-assistant-decided, path: pdr-0066-010-act4-replay-details-assistant-decided.md, summary: "2026-10-30 acceptée — Détails du rejeu A2UI (010, acte 4) tranchés par la boucle (pdr-0062) : journal client en mémoire du flux brut, rejeu par le même A2uiGate, entrée/sortie Direct, vitesses discrètes 0,25×–2×, curseur par remise à vide puis réinjection, écarts plafonnés à 3 s", tags: [pdr, replay, acte-4, fr-09], decision_status: acceptée}
  - {id: pdr-0067-gpt-live-session-cap-30-min, path: pdr-0067-gpt-live-session-cap-30-min.md, summary: "2026-10-30 acceptée — plafond de session GPT-Live 30 min par défaut (tranche Q-68)", tags: [pdr, gpt-live, budget], decision_status: acceptée}
  - {id: pdr-0068-act3-decision-not-kept-after-new-request, path: pdr-0068-act3-decision-not-kept-after-new-request.md, summary: "2026-10-30 acceptée — décision Bloquée/Validée non conservée après une nouvelle demande : limite acceptée (tranche Q-76)", tags: [pdr, act-3, limite], decision_status: acceptée}
  - {id: pdr-0069-voice-interruption-hybrid-stop-011, path: pdr-0069-voice-interruption-hybrid-stop-011.md, summary: "2026-10-30 acceptée — interruption vocale hybride dès 011 : consigne au modèle, mot-clé « stop » détecté par l'orchestrateur, coupure locale du son côté client (tranche Q-42, Q-40, Q-67 ; Q-41 conforme)", tags: [pdr, voix, barge-in, stop], decision_status: acceptée}
  - {id: pdr-0070-llm-composer-and-crashlist-012, path: pdr-0070-llm-composer-and-crashlist-012.md, summary: "2026-10-30 acceptée — fonctionnalité 012 : compositeur LLM réel (pdr-0060) avec repli déterministe, puis CrashList réel", tags: [pdr, composition, catalogue, crashlist], decision_status: acceptée}
  - {id: pdr-0071-act2-focus-memory-act-indicator-click-feedback, path: pdr-0071-act2-focus-memory-act-indicator-click-feedback.md, summary: "2026-10-30 acceptée — mémoire de focus par canevas, indicateur d'acte automatique, retour visuel fort au clic (tranche Q-74, Q-75 ; complète pdr-0063 D1)", tags: [pdr, acte-2, indicateur, clic], decision_status: acceptée}
  - {id: pdr-0072-design-ergonomics-013, path: pdr-0072-design-ergonomics-013.md, summary: "2026-10-30 acceptée — design et ergonomie : fonctionnalité dédiée 013 après 011-012", tags: [pdr, design, ergonomie, widgetbook], decision_status: acceptée}
  - {id: pdr-0073-011-voice-interaction-details-assistant-decided, path: pdr-0073-011-voice-interaction-details-assistant-decided.md, summary: "2026-10-30 acceptée (délégation pdr-0062), amendée deux fois (revue du plan, revue du code) — 011 : voice.interrupted, détecteur de mots d'arrêt (premier mot significatif), Interrupt par époque, focus, indicateur monotone, clic idempotent côté client", tags: [pdr, voix, stop, focus, 011], decision_status: acceptée}
