inherited:
  - {id: adr-0001-initial-constraints, path: ../../knowledge/decisions/adr-0001-initial-constraints.md, summary: "2026-10-26 acceptée — Flutter, Clean+FSD, get_it/injectable, Bloc sans Cubit, TDD/BDD", applies: "Architecture front (barrels, DI par constructeur, Bloc sealed/freezed), BDD bdd_widget_test depuis les .feature de la fiche, mocks aux frontières ; cible web/mobile de l'ADR restreinte au desktop Linux (pdr-0026, pdr-0028)"}
  - {id: adr-0002-orchestrator-backend, path: ../../knowledge/decisions/adr-0002-orchestrator-backend.md, summary: "2026-10-27 acceptée — orchestrateur côté backend dès la phase 1", applies: "Orchestrateur et agents A2A côté backend ; l'app ne porte que audio/WebRTC, rendu A2UI et outils locaux sans secret (NFR-09) ; journal de rejeu (flux A2UI) côté app pour l'acte 4 (pdr-0032)"}
  - {id: adr-0003-backend-go, path: ../../knowledge/decisions/adr-0003-backend-go.md, summary: "2026-10-27 acceptée puis reconfirmée — backend Go hexagonal, module agent_orchestrator", applies: "Backend Go, ports pour Live et A2UI, JWT par JWKS et CORS restreint (AGENTS.md § 2) ; démo locale (pdr-0029) : dépôt (Q-27) et authentification de la route de relais (Q-48) à confirmer par le porteur, recommandation « ce dépôt, 127.0.0.1 sans auth » ; a2a-go/v2 dès le MVP pour des agents A2A réels (pdr-0036)"}
  - {id: adr-0004-ds-visual-base-m3, path: ../../knowledge/decisions/adr-0004-ds-visual-base-m3.md, summary: "2026-10-28 acceptée — DS maison sur Material 3 via material_ui + conventions desktop", applies: "Composants Ds* sur material_ui enveloppés par les CatalogItem ; thème de scène via ThemeData/ThemeExtension ; raccourcis facultatifs, actions critiques à la souris (pdr-0033)"}
  - {id: adr-0005-ds-tokens-style-dictionary, path: ../../knowledge/decisions/adr-0005-ds-tokens-style-dictionary.md, summary: "2026-10-28 acceptée — tokens DTCG dans Git, Style Dictionary + ThemeExtension custom", applies: "Thème de scène (texte ≥ 24 px, contraste WCAG AA, NFR-05) décrit en tokens DTCG et généré en Dart ; code généré committé et vérifié en CI"}
  - {id: adr-0006-ds-no-widgetbook-cloud, path: ../../knowledge/decisions/adr-0006-ds-no-widgetbook-cloud.md, summary: "2026-10-28 acceptée — pas de Widgetbook Cloud : goldens locaux + catalogue web statique", applies: "Non-régression visuelle des composants du catalogue par goldens alchemist en CI ; pas d'annotation cloud*"}
  - {id: adr-0007-ds-design-tool-claude-design, path: ../../knowledge/decisions/adr-0007-ds-design-tool-claude-design.md, summary: "2026-10-28 acceptée — Claude Design pour maquettes/prototypes ; DTCG reste source de vérité", applies: "Maquettes, prototypes de surfaces et slides du talk dans Claude Design ; les maquettes illustrent la vision, ce ne sont ni une spécification ni du code (pdr-0017) ; pas de Figma"}
  - {id: adr-0008-ds-widgetbook-4-beta, path: ../../knowledge/decisions/adr-0008-ds-widgetbook-4-beta.md, summary: "2026-10-28 acceptée — Widgetbook 4.0.0-beta.14 épinglé", applies: "Une story par composant du catalogue, surfaces A2UI rejouées en cache ; même politique d'épinglage que pdr-0010 ; 5 contournements du spike à appliquer"}
