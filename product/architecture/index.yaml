domain: architecture
description: "Architecture de Genesis Canvas : vue d'ensemble C4, app Flutter desktop, backend Go orchestrateur, agents et protocoles (WebRTC, sideband, A2A, A2UI), stack et versions, rejeu, sécurité, qualité, environnement de scène"
docs:
  - {id: p-ar-overview, path: overview.md, summary: "Contexte et conteneurs (Mermaid), répartition client/backend, principes, carte NFR-01/02/03/07/08/09 → composants ; 009 : le clic repart en HTTP vers l'orchestrateur", tags: [architecture, c4, orchestrateur, nfr]}
  - {id: p-ar-frontend, path: frontend.md, summary: "App Flutter desktop : slices FSD, couches Clean, Blocs et transformers (réels après 005 et 007 : agent_activity, protocol_feed, catalog_shelf, stage_controls), DI, rendu GenUI, arborescence et paquets réels après 007 (entities/catalog, shared/design_system, widgets de l'écran), tests d'architecture du workspace ; 009 : CanvasActionBloc, catalogue à 5 items, clic par ActionDelegate", tags: [frontend, flutter, fsd, bloc, genui, design-system]}
  - {id: p-ar-frontend-screen, path: frontend-screen.md, summary: "Réel après 007 : six zones livrées (widgets, Blocs sources), catalogue genesis côté client (BoundObject, trois états squelette / sans données / neutre, squelette peint par CanvasBoard, json_schema_builder), A2uiGate et validation à état, remise à vide (_resetStage, réessai sur busy), DI et ordre de _shutdown, variables d'environnement de l'app (GENESIS_CATALOG_ID, GENESIS_CANVAS_RESET_*), budget 1920×1080 et fenêtre Linux, écart consigné : stories Widgetbook et goldens reportés ; 008 : ligne de comparaison comparison-<surface>, légende de séries par plateforme (3.3 en pointillés), colonnes de checklist calculées, remise à vide de démarrage (D6), asset act2-replay ; 009 : Barre d'actions et bandeau, CanvasActionBloc, budget des zones modifié (barre 128, canevas 572), assets de rejeu act2 (19 messages) et act3 (20), variables GENESIS_CANVAS_ACTION_*, polices de test versionnées", tags: [frontend, ecran, catalogue, genesis, validation, remise-a-vide]}
  - {id: p-ar-backend, path: backend.md, summary: "Orchestrateur Go hexagonal : modules (003 et 004 implémentés), ports, règles de l'orchestrateur, session GPT-Live (voix brise), agents A2A réels qui produisent l'A2UI, configuration, déploiement local docker compose ; 006 : trois agents (module unique backend/agents, noyau kit), sélection des agents par tags de carte (Planner), configuration AGENTS en Nom=URL et A2UI_ALLOWED_PROPS / A2UI_BINDING_PROPS ; 007 : remise à vide du canevas (httpapi.CanvasResetter, port.ErrCanvasBusy, sessions suivies par Manager, Pipeline.ResetCanvas, Registry.Reset) ; 008 : orchestrate.Canvas (registre partagé entre sessions, ordre des verrous, orphelins), ResetCanvas en une passe, kit.ParseIntent (ScopeError à motifs fermés), mutation de l'acte 2 par updateDataModel seul ; 009 : POST /canvas/actions, Manager.Act, ActionPlanner, VoiceReply.Announce (voix hors délégation), A2UI_COMPONENTS à 5, A2UI_WRITABLE_SUBPATHS, VOICE_ANNOUNCE_TIMEOUT", tags: [backend, go, hexagonal, a2a, sideband]}
  - {id: p-ar-agents-protocols, path: agents-protocols.md, summary: "Protocoles par frontière et séquences Mermaid des actes 1-3, de l'interruption et de « Stop » ; A2UI v0.9 (pdr-0018) ; l'orchestrateur valide et relaie l'A2UI des agents (pdr-0036) ; écarts E1, E7-E9, E11 ; acte 1 avec message plan et trois agents en parallèle (006), metadata genesis/activeSurfaces, refus de l'orchestrateur distinct du refus défensif de l'agent ; 007 : validation A2UI côté client (codes communs avec le Go, verdict ignored, compensation locale) et séquence de la remise à vide ; 008 : séquence de l'acte 2 livrée (updateDataModel seul, correction iOS), annulation en vol et révision du plan restent à J7 ; acte 3 livré par 009 : clic en HTTP (et non WSS), séquence mise à jour, politique vocale hors délégation (Q-75 ouverte)", tags: [protocoles, a2a, a2ui, webrtc, sequence, barge-in]}
  - {id: p-ar-app-channel-contract, path: app-channel-contract.md, summary: "Contrat v1 implémenté (003 et 004) et côté client (005 : WSS après le 200, messages illisibles ignorés, ChannelLost, journal local EnvelopeLog) : routes, enveloppe (agent, task), messages a2ui / agent.activity / delegation, rétention du hub, ordre garanti, politique d'échec (compensation deleteSurface), file par session, validateur A2UI ; 006 : message plan, état rejected, surfaces actives (genesis/activeSurfaces), validateur de propriétés (bad_property), catalogue genesis v1 (4 composants) ; 007 : route POST /canvas/reset (204, 409 pendant une délégation, gardes Origin / JSON / 1 Kio) et côté client (validation, client de remise à vide, GENESIS_CATALOG_ID) ; 008 : registre de canevas partagé entre sessions (orphelins, remise à vide en une passe, limite de la rétention du hub par session), fixtures act2-* et correction-ios-* ; 009 : route POST /canvas/actions (codes, ordre des refus, corps strict), plan.delegation = act-n, sous-chemins inscriptibles et code path_not_allowed, client d'action", tags: [protocoles, app-channel, a2ui, wss, contrat, agent-activity, validation]}
  - {id: p-ar-stack, path: stack.md, summary: "Tableau des technologies : version relevée dans knowledge, date, statut stable/bêta/expérimental, source ; plateformes", tags: [stack, versions, epinglage]}
  - {id: p-ar-replay, path: replay.md, summary: "Journal JSONL du flux A2UI seul, lecteur de rejeu 0,25×–2× (acte 4), déterminisme, réutilisations ; plus de mode secours intégré (pdr-0032)", tags: [rejeu, acte-4, journal, determinisme]}
  - {id: p-ar-security, path: security.md, summary: "Menaces et parades : clé OpenAI en .env côté backend, services sur 127.0.0.1 sans auth (reco, Q-48 à confirmer), catalogue fermé, actions typées, injection, agents A2A durcis et A2UI validé (004), validation côté client livrée par 007 (Q-71 → pdr-0053) et ses limites, faits vérifiés côté app (005), budget 20 € ; 006 : propriétés et liaison validées, entrées bornées (tags, noms d'agent) ; 007 : gardes de POST /canvas/reset ; 009 : gardes de POST /canvas/actions, aucune donnée du client relayée à l'agent, sous-chemins inscriptibles, consigne vocale sans donnée d'agent", tags: [securite, cles, a2ui, cout]}
  - {id: p-ar-quality, path: quality.md, summary: "Pyramide de tests TDD/BDD, traçabilité scénario → exigence, mesure de chaque NFR, CI, observabilité ; premières mesures de l'acte 1 en réel (006, agents déterministes) ; acceptation Flutter livrée par 007 (24 scénarios), parité des fixtures négatives Go/Dart, test de page 1920×1080 en police Ahem et limite ; acceptation de l'acte 3 livrée par 009 (S-03, C1-C6, A1), essai réel inabouti sur la voix, hermétisme des polices", tags: [qualite, tdd, bdd, nfr, ci]}
  - {id: p-ar-stage-runtime, path: stage-runtime.md, summary: "Machine de démo Linux, réseau, règles audio de l'app, régie, repères techniques avant talk, critères de répétition ; remise à vide en répétition et plus de consigne de régie depuis 008 (Q-73 résolue ; app relancée : remise à vide au démarrage), fenêtre 1920×1080 ; logistique gérée par le porteur ; 009 : points à observer en répétition (voix après un clic, 409 busy, bande vide)", tags: [scene, audio, reseau, repetition]}
